<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>MyCafe Login</title>
  <meta name="description" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./assets/css/index.css">

</head>

<body>
  <div class="form-popup">
    <div class="form-logo">
      <img src="assets/icons/myCafe.png" alt="">
    </div>
    <form id="login_form" name="login_form" autocomplete="off" method="post"
      enctype="application/x-www-form-urlencoded">
      <div class="input-wrapper">
        <input type="text" id="username" class="username" name="username" size="20" autocapitalize="off"
        autocorrect="off" autocomplete="on" autofocus="on" required placeholder="Username" />
      </div>
      <div class="input-wrapper">
        <input id="password" type="password" name="password" autocorrect="off" autocomplete="off"
        autocomplete="new-password" value="" size="20" required placeholder="Password" />
      </div>

      <button id="submit" type="submit" name="submit" class="submit-btn">Kirish</button>
    </form>
  </div>
</body>
<script src="./assets/js/auth.js"></script>
