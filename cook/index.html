<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cook</title>
    <link rel="shortcut icon" href="assets/icons/FooBoo-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="./assets/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.7.2/css/all.css">
</head>

<body>
    <header class="header section-bottom">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <img src="assets/icons/FooBoo.png" draggable="false" alt="Logo">
                </div>
                <div class="actions-box">
                    <button class="circle-button button-green">
                        <i class="fa-regular fa-user"></i>
                    </button>
                    <button class="circle-button button-green">
                        <i class="fa-regular fa-bars"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <section class="banner-section section-bottom">
        <div class="container">
            <div class="banner-content">
                <div class="banner-content-title">
                    <h1>MY CAFE</h1>
                    <p>Oshpazlar</p>
                </div>
            </div>
        </div>
    </section>

    <main>
        <!--  -->
        <section class="statistics-section section-bottom">
            <div class="container">
                <div class="statistics-content">
                    <div class="statistics-item">
                        <h3>5</h3>
                        <p>Kutilayotgan buyurtmalar</p>
                    </div>
                    <div class="statistics-item">
                        <h3>34</h3>
                        <p>Topshirilgan buyurtmalar</p>
                    </div>
                    <div class="statistics-item">
                        <h3>2</h3>
                        <p>Yetkaziladigan buyurtmalar</p>
                    </div>
                    <div class="statistics-item">
                        <h3>2</h3>
                        <p>Bron qilingan buyurtmalar</p>
                    </div>
                </div>
            </div>
        </section>
        <section>
            <div class="container">
                <div class="layout">
                    <aside class="side-content">
                        <div class="sidebar-item">
                            <div class="sidebar-item-header">
                                <h2 class="title">Kutilayotgan taomlar</h2>
                            </div>
                            <div id="orders-container" class="orders-container"></div>
                        </div>
                    </aside>
                    <div class="main-content">
                        <div class="ongoing-orders" id="ongoing-orders">
                            <div class="ongoing-orders-header">
                                <h2 class="title">Tayyorlanayotgan taomlar</h2>
                            </div>
                            <div class="ongoing-orders-box"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <div class="verify-prepared-bg"></div>
    <div class="verify-prepared">
        <div id="verify-meal-info" class="meal-info"></div>
        <div class="verify-popup-btns">
            <div class="verify-question">
                <h1>Prepared?</h1>
            </div>
            <button onclick="verifyPrepared()">Yes</button>
            <button onclick="closePreparedVerify()">No</button>
        </div>
    </div>



    <script src="./assets/index.js"></script>
</body>

</html>
