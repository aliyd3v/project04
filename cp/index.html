<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./assets/icons/mycafe-favi.png">
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.7.2/css/all.css">
    <link rel="stylesheet" href="assets/css/index.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js"></script>
    <title>MyCafe Dashboard</title>
</head>

<body>
    <div class="viewport">
        <div class="side-bar">
            <div class="logo">
                <img src="assets/icons/mycafe.png" draggable="false" alt="">
            </div>
            <nav>
                <ul class="side-bar-nav-list">
                    <li>
                        <a class="food-sect-links" onclick="director('index')">
                            <i class="fa-solid fa-display"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('product')">
                            <i class="fa-solid fa-utensils"></i>
                            <span>Taomlar</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('category')">
                            <i class="fa-solid fa-table-list"></i>
                            <span>Kategoriyalar</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('order')">
                            <i class="fa-solid fa-receipt"></i>
                            <span>Orders</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('table')">
                            <i class="fa-solid fa-chair"></i>
                            <span>Tables</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('user')">
                            <i class="fa-solid fa-users"></i>
                            <span>Users</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('history')">
                            <i class="fa-solid fa-clock-rotate-left"></i>
                            <span>History</span>
                        </a>
                    </li>
                </ul>
            </nav>  
        </div>
        <div class="dashboard-cont">
            <header class="header">
                <div class="container">
                    <div class="header-cont">
                        <h1>DASHBOARD</h1>
                        <div class="header-actions">
                            <button class="profile-btn">
                                <i class="fa-light fa-user"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </header>
            <section class="content">
                <div class="container">
                    <div class="food-sects" id="dashboard">
                        <h3 style="color: #ffffffd3;">
                            BU YERGA TEZ KUNDA YANGI KONTENT JOYLANADI ! !
                            <br>
                            <br>
                            Boshqa sahifalarni tekshiring.
                        </h3>
                    </div>
                </div>
            </section>
        </div>
    </div>
    <script  src="/assets/js/script.js"></script>

</body>

</html>
