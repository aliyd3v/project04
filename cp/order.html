<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./assets/icons/mycafe-favi.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js"></script>
    <link rel="stylesheet" href="assets/css/index.css">
    <title>MyCafe Dashboard</title>
</head>

<body>
    <div class="viewport">
        <div class="side-bar">
            <div class="logo">
                <img src="assets/icons/FooBoo.png" draggable="false" alt="">
            </div>
            <nav>
                <ul class="side-bar-nav-list">
                    <li>
                        <a class="food-sect-links" onclick="director('index')">
                            <i class="bi bi-display"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('product')">
                            <i class="bi bi-fork-knife"></i>
                            <span>Taomlar</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('category')">
                            <i class="bi bi-card-list"></i>
                            <span>Kategoriyalar</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('order')">
                            <i class="bi bi-receipt"></i>
                            <span>Buyurtmalar</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('table')">
                            <i class="bi bi-1-square"></i>
                            <span>Stollar</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('user')">
                            <i class="bi bi-people"></i>
                            <span>Foydalanuvchilar</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('history')">
                            <i class="bi bi-clock-history"></i>
                            <span>Arxiv</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
        <div class="dashboard-cont">
            <div class="progress-loader">
                <span class="loader"></span>
            </div>
            <header class="header">
                <div class="container">
                    <div class="header-cont">
                        <h1>BUYURTMALAR</h1>
                        <div class="header-actions">
                            <button class="profile-btn">
                                <i class="bi bi-person-circle"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </header>
            <section class="content">
                <div class="container">
                    <div id="orders" class="food-sects">
                        <div class="orders-box">
                            <div id="orders-container" class="orders-container"></div>
                            <div class="del-popup-background"></div>
                            <div class="del-popup">
                                <div class="del-title">
                                    <h3>Buyurtma rad etilsinmi?</h3>
                                </div>
                                <div class="del-actions">
                                    <button class="cancel-btn" id="close-del-btn">Bekor qilish</button>
                                    <button class="delete-btn" id="order-del-btn">Rad etish</button>
                                </div>
                            </div>
                            <!-- details popup -->
                            <div class="details-popup-bg"></div>
                            <div class="details-popup">
                                <div class="details-popup-content">
                                    <div class="details-popup-header">
                                        <h3 class="details-popup-title">
                                            Buyurtmalar ro'yxati
                                        </h3>
                                    </div>
                                    <div class="details-popup-list-wrapper">
                                        <ul class="details-popup-list"></ul>
                                    </div>
                                </div>
                                <div class="details-popup-actions">
                                    <button onclick="detailsPopUpClose()">Yopish</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
    <script src="assets/js/script.js"></script>
    <script src="assets/js/order.js"></script>
</body>

</html>
