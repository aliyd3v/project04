<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./assets/icons/mycafe-favi.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js"></script>
    <link rel="stylesheet" href="assets/css/index.css">
    <title>MyCafe Dashboard</title>
</head>

<body>
    <div class="viewport">
        <div class="side-bar">
            <div class="logo">
                <img src="assets/icons/FooBoo.png" draggable="false" alt="">
            </div>
            <nav>
                <ul class="side-bar-nav-list">
                    <li>
                        <a class="food-sect-links" onclick="director('index')">
                            <i class="bi bi-display"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('product')">
                            <i class="bi bi-fork-knife"></i>
                            <span>Taomlar</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('category')">
                            <i class="bi bi-card-list"></i>
                            <span>Kategoriyalar</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('order')">
                            <i class="bi bi-receipt"></i>
                            <span>Buyurtmalar</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('table')">
                            <i class="bi bi-cup-straw"></i>
                            <span>Stollar</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('user')">
                            <i class="bi bi-people"></i>
                            <span>Foydalanuvchilar</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('history')">
                            <i class="bi bi-clock-history"></i>
                            <span>Arxiv</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
        <div class="dashboard-cont">
            <div class="progress-loader">
                <span class="loader"></span>
            </div>
            <header class="header">
                <div class="container">
                    <div class="header-cont">
                        <h1>STOLLAR</h1>
                        <div class="header-actions">
                            <button onclick="openCreateModal()" class="create-btn button" id="tableCreateButton">
                                <i class="bi bi-plus"></i>
                                Stol qo'shish
                            </button>
                            <button class="profile-btn">
                                <i class="bi bi-person-circle"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </header>
            <section class="content">
                <div class="container">
                    <div id="create" class="create-form">
                        <div class="form-header">
                            <h2 class="section-title">Stol qo'shish</h2>
                        </div>
                        <div class="form-box">
                            <form id="create-form">
                                <div>
                                    <label for="name">Stol raqami:</label>
                                    <input type="number" name="number" id="number-in-create" required> <br>
                                </div>
                                <div class="action-box">
                                    <button type="button" onclick="closeCreateModal()">Bekor qilish</button>
                                    <button type="submit">Qo'shish</button>
                                </div>
                            </form>
                        </div>
                    </div>
                    <div id="update" class="update-form">
                        <div class="form-header">
                            <h2 class="section-title">Stolni tahrirlash</h2>
                        </div>
                        <div class="form-box">
                            <div style="display: none;" id="updating-table-data-id"></div>
                            <form id="update-form">
                                <div>
                                    <label for="name">Stol raqami:</label>
                                    <input type="number" name="number" id="number-in-update" required> <br>
                                </div>
                                <div class="action-box">
                                    <button type="button" onclick="closeUpdateModal()">Bekor qilish</button>
                                    <button type="submit">Tahrirlash</button>
                                </div>
                            </form>
                        </div>
                    </div>
                    <div class="popup-bg"></div>
                    <div id="tables" class="food-sects">
                        <div class="table-box">
                            <!-- bu yerda JS yordamida Table lar yig'iladi -->
                        </div>
                    </div>
                    <div class="del-popup table-del-popup"></div>
                    <div class="del-popup-background"></div>
                </div>
            </section>
        </div>
    </div>
    <script src="assets/js/script.js"></script>
    <script src="assets/js/table.js"></script>
</body>

</html>
