<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.7.2/css/all.css">
    <link rel="stylesheet" href="assets/css/index.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js"></script>
    <title>MyCafe Dashboard</title>
</head>

<body>
    <div class="viewport">
        <div class="side-bar">
            <div class="logo">
                <img src="assets/icons/mycafe.png" draggable="false" alt="">
            </div>
            <nav>
                <ul class="side-bar-nav-list">
                    <li>
                        <a class="food-sect-links" onclick="director('index')">
                            <i class="fa-solid fa-display"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('product')">
                            <i class="fa-solid fa-utensils"></i>
                            <span>Taomlar</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('category')">
                            <i class="fa-solid fa-table-list"></i>
                            <span>Kategoriyalar</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('order')">
                            <i class="fa-solid fa-receipt"></i>
                            <span>Orders</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('table')">
                            <i class="fa-solid fa-chair"></i>
                            <span>Tables</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('user')">
                            <i class="fa-solid fa-users"></i>
                            <span>Users</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('history')">
                            <i class="fa-solid fa-clock-rotate-left"></i>
                            <span>History</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
        <div class="dashboard-cont">
            <div class="progress-loader">
                <span class="loader"></span>
            </div>
            <header class="header">
                <div class="container">
                    <div class="header-cont">
                        <h1>KATEGORIYALAR</h1>
                        <div class="header-actions">
                            <button onclick="openCreateModal()" class="create-btn button" id="categoryCreateButton">
                                <i class="fa-regular fa-plus"></i>
                                Kategoriya qo'shish
                            </button>
                            <button class="profile-btn">
                                <i class="fa-light fa-user"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </header>
            <section class="content">
                <div class="container">
                    <div id="create" style="display: none;">
                        <div class="form-header">
                            <h2 class="section-title">Kategoriya qo'shish</h2>
                        </div>
                        <div class="form-box">
                            <form id="create-form">
                                <div>
                                    <label for="name">Kategoriya nomi:</label>
                                    <input type="text" name="name" id="name-in-create" required> <br>
                                </div>
                                <div>
                                    <label for="active">Faolmi?</label>
                                    <select name="active" id="active-in-create">
                                        <option value="0">Yo'q</option>
                                        <option value="1">Ha</option>
                                    </select><br>
                                </div>
                                <button type="button" onclick="closeCreateModal()">Bekor qilish</button>
                                <button type="submit">Qo'shish</button>
                            </form>
                        </div>
                    </div>
                    <div id="update" style="display: none;">
                        <div class="form-header">
                            <h2 class="section-title">Kategoriyani tahrirlash</h2>
                        </div>
                        <div class="form-box">
                            <div style="display: none;" id="updating-category-data-id"></div>
                            <form id="update-form">
                                <div>
                                    <label for="name">Kategoriya nomi:</label>
                                    <input type="text" name="name" id="name-in-update" required> <br>
                                </div>
                                <div>
                                    <label for="active">Faolmi?</label>
                                    <select name="active" id="active-in-update"></select><br>
                                </div>
                                <button type="button" onclick="closeUpdateModal()">Bekor qilish</button>
                                <button type="submit">Saqlash</button>
                            </form>
                        </div>
                    </div>
                    <div id="categories" class="food-sects">
                        <div class="category-box">
                            <!-- bu yerda JS yordamida Kategoriyalar yig'iladi -->
                        </div>
                    </div>
                    <div class="del-popup category-del-popup"></div>
                    <div class="del-popup-background" onclick="closeDeletePopup()"></div>
                </div>
            </section>
        </div>
    </div>
    <script src="/assets/js/script.js"></script>
    <script src="/assets/js/category.js"></script>
</body>

</html>
