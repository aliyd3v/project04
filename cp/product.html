<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./assets/icons/mycafe-favi.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/index.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js"></script>
    <title>MyCafe Dashboard</title>
</head>

<body>
    <div class="viewport">
        <div class="side-bar">
            <div class="logo">
                <img src="assets/icons/FooBoo.png" draggable="false" alt="">
            </div>
            <nav>
                <ul class="side-bar-nav-list">
                    <li>
                        <a class="food-sect-links" onclick="director('index')">
                            <i class="bi bi-display"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('product')">
                            <i class="bi bi-fork-knife"></i>
                            <span>Taomlar</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('category')">
                            <i class="bi bi-card-list"></i>
                            <span>Kategoriyalar</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('order')">
                            <i class="bi bi-receipt"></i>
                            <span>Buyurtmalar</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('table')">
                            <i class="bi bi-1-square"></i>
                            <span>Stollar</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('user')">
                            <i class="bi bi-people"></i>
                            <span>Foydalanuvchilar</span>
                        </a>
                    </li>
                    <li>
                        <a class="food-sect-links" onclick="director('history')">
                            <i class="bi bi-clock-history"></i>
                            <span>Arxiv</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
        <div class="dashboard-cont">
            <div class="progress-loader">
                <span class="loader"></span>
            </div>
            <header class="header">
                <div class="container">
                    <div class="header-cont">
                        <h1>TAOMLAR</h1>
                        <div class="header-actions">
                            <button class="create-btn button" id="mealCreateButton" onclick="openCreateModal()">
                                <i class="bi bi-plus"></i>
                                Taom qo'shish
                            </button>
                            <button class="profile-btn">
                                <i class="bi bi-person-circle"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </header>
            <section class="content">
                <div class="container">
                    <div class="popup-bg"></div>
                    <div id="create" class="create-form">
                        <div class="form-header">
                            <h2 class="section-title">Taom qo'shish</h2>
                        </div>
                        <div class="form-box">
                            <form id="create-form" enctype="multipart/form-data">

                                <div>
                                    <label for="name">Taom nomi:</label>
                                    <input type="text" name="name" id="name-in-create" required>
                                </div>

                                <div>
                                    <label for="price">Taom narxi:</label>
                                    <input type="number" name="price" id="price-in-create" required>
                                </div>

                                <div>
                                    <label for="category_id">Kategoriyani tanlang:</label>
                                    <select name="category_id" id="category_id-in-create" required></select>
                                </div>

                                <div>
                                    <label for="is_ready_product">Taom tayyormi?</label>
                                    <select name="is_ready_product" id="is_ready_product-in-create">
                                        <option value="0">Yo'q</option>
                                        <option value="1">Ha</option>
                                    </select>
                                </div>

                                <div>
                                    <label for="active">Holati?</label>
                                    <select name="active" id="active-in-create">
                                        <option value="0">Faol emas</option>
                                        <option value="1">Faol</option>
                                    </select>
                                </div>

                                <div>
                                    <label for="image">Taom rasmini kiriting</label>
                                    <input type="file" id="image-in-create" name="image">
                                </div>

                                <div class="action-box">
                                    <button type="button" onclick="closeCreateModal()">Bekor qilish</button>
                                    <button type="submit">Taomni qo'shish</button>
                                </div>
                            </form>
                        </div>
                    </div>
                    <div id="update" class="update-form">
                        <div class="form-header">
                            <h2 class="section-title">Taomni yangilash</h2>
                        </div>
                        <div class="form-box">
                            <div style="display: none;" id="updating-product-data-id"></div>
                            <form id="update-form" enctype="multipart/form-data">

                                <div>
                                    <label for="name">Taom nomi:</label>
                                    <input type="text" name="name" id="name-in-update" required> <br>
                                </div>

                                <div>
                                    <label for="price">Taom narxi:</label>
                                    <input type="number" name="price" id="price-in-update" required><br>
                                </div>

                                <div>
                                    <label for="category_id">Kategoriyani tanlang</label>
                                    <select name="category_id" id="category_id-in-update" required></select><br>
                                </div>

                                <div>
                                    <label for="is_ready_product">Mahsulot tayyor holatda bo'ladimi?</label>
                                    <select name="is_ready_product" id="is_ready_product-in-update"></select><br>
                                </div>

                                <div>
                                    <label for="active">Holati?</label>
                                    <select name="active" id="active-in-update"></select><br>
                                </div>

                                <div>
                                    <label for="image">Mahsulot rasmini kiriting</label>
                                    <input type="file" id="image-in-update" name="image"><br>
                                </div>

                                <div class="action-box">
                                    <button type="button" onclick="closeUpdateModal()">Bekor qilish</button>
                                    <button type="submit">Tahrirlash</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="food-sects" id="products">
                    <table>
                        <thead class="products-table-header">
                            <tr>
                                <th class="product-table-header-item"><span>Rasm</span></th>
                                <th class="product-table-header-item"><span>Nomi</span></th>
                                <th class="product-table-header-item"><span>Narxi</span></th>
                                <th class="product-table-header-item"><span>Kategoriyasi</span></th>
                                <th class="product-table-header-item"><span>Taom tayyormi?</span></th>
                                <th class="product-table-header-item"><span>Holati?</span></th>
                                <th class="product-table-header-item"><span>Amallar</span></th>
                            </tr>
                        </thead>
                        <div class="container">
                            <tbody class="products-box"></tbody>
                        </div>
                    </table>
                </div>
                <div class="del-popup-background" onclick="closeDeletePopup()"></div>
                <div class="del-popup"></div>
            </section>
        </div>
    </div>
    <script src="assets/js/script.js"></script>
    <script src="assets/js/product.js"></script>
</body>

</html>
